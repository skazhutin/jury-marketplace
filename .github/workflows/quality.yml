name: Jury quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

concurrency:
  group: jury-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['20', '24']
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: plugins/*/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Validate complete plugin packages and role restrictions
        run: python scripts/validate_repository.py
      - name: Project Jury tests, audit and reproducible bundle
        working-directory: plugins/project-jury
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=moderate
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
          npm run build
      - name: Startup Jury tests, audit and reproducible bundles
        working-directory: plugins/startup-jury
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=moderate
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
          python engine/scripts/test_recording.py
          npm run build
      - name: Require checked-in bundles to match source and lockfiles
        run: |
          python scripts/update_notices.py
          git diff --exit-code -- plugins/project-jury/server/bundle.mjs plugins/startup-jury/server/bundle.mjs plugins/startup-jury/web/result.html plugins/*/THIRD_PARTY_NOTICES.md
