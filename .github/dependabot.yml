version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /plugins/project-jury
      - /plugins/startup-jury
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      jury-runtime:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      ci:
        patterns: ['*']
